<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Disk Mac</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-mark" src="logo.png" alt="" />
          <span class="brand-name">Disk Mac</span>
        </div>
        <nav class="tabs" role="tablist" aria-label="Navegação principal">
          <button class="tab" role="tab" data-view="home">Início</button>
          <button class="tab" role="tab" data-view="activity">Monitor do sistema</button>
          <button class="tab" role="tab" data-view="deep">Limpeza completa</button>
          <button class="tab" role="tab" data-view="analyze">Analisar disco</button>
          <button class="tab" role="tab" data-view="optimize">Otimizar</button>
          <button class="tab" role="tab" data-view="uninstall">Desinstalar apps</button>
          <button class="tab" role="tab" data-view="backups">Backups</button>
          <button class="tab" role="tab" data-view="history">Histórico</button>
          <button class="tab" role="tab" data-view="settings" aria-label="Ajustes">Ajustes</button>
        </nav>
        <div class="sidebar-footer">Ferramentas para cuidar do seu Mac</div>
      </aside>
      <main id="view" class="view"></main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
